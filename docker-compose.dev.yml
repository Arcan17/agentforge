services:
  db:
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@db:5432/agentforge
      LOG_LEVEL: DEBUG
    volumes:
      - .:/app
